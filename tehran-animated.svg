<g fill="#1b3047">
 <path d="M0 398v-55h26v55h17v-72h24v72h15v-48h34v48h18v-86h27v86h16v-58h26v58h17v-70h32v70h18v-44h29v44h15v-88h31v88h17v-60h28v60h18v-77h34v77h18v-51h26v51h17v-92h29v92h18v-57h30v57h17v-72h34v72h18v-50h26v50h17v-84h29v84h18v-61h32v61h17v-48h28v48h20v-72h31v72h18v-52h27v52h18v-67h28v67h15v-43h25v43h20v-77h30v77h15v-54h30v54h20v-70h30v70h20v-48h30v48h20v-60h30v60h10v142H0Z"/>
</g>
<!-- varied mid-rise buildings -->
<g fill="url(#building)">
 <path d="M0 443v-67h49v67h15v-93h56v93h17v-58h43v58h17v-106h58v106h19v-73h42v73h18v-116h55v116h18v-83h47v83h17v-102h55v102h18v-66h42v66h17v-111h57v111h18v-80h46v80h18v-100h55v100h18v-69h45v69h20v-91h51v91h17v-72h49v72h20v-110h54v110h18v-80h44v80h20v-62h45v62h20v-92h55v92h10v97H0Z"/>
</g>
<g opacity=".8" fill="url(#lit)">
 <path d="M0 443v-67h49v67h15v-93h56v93h17v-58h43v58h17v-106h58v106h19v-73h42v73h18v-116h55v116h18v-83h47v83h17v-102h55v102h18v-66h42v66h17v-111h57v111h18v-80h46v80h18v-100h55v100h18v-69h45v69h20v-91h51v91h17v-72h49v72h20v-110h54v110h18v-80h44v80h20v-62h45v62h20v-92h55v92h10v97H0Z"/>
</g>
<!-- Milad Tower: slender shaft, broad multi-storey pod, upper crown and antenna -->
<g id="milad-tower">
 <ellipse cx="694" cy="457" rx="47" ry="12" fill="#f4b77f" opacity=".22" filter="url(#glow)"/>
 <!-- tapered concrete shaft -->
 <path d="M687 465 691 244 697 244 702 465Z" fill="url(#tower)" stroke="#dce1e2" stroke-opacity=".45" stroke-width="1"/>
 <path d="M692 255 695 255 699 463 694 463Z" fill="#fff1d9" opacity=".25"/>
 <!-- lower neck and support collar -->
 <path d="M687 249 690 230 698 230 702 249 697 261 692 261Z" fill="#a7b6c0" stroke="#e0e5e5" stroke-width="1"/>
 <!-- main pod, wider at top with faceted sides -->
 <path d="M676 230 666 215 668 195 679 180 693 174 708 180 720 195 722 215 711 230 703 237 685 237Z" fill="url(#pod)" stroke="#e1e6e7" stroke-width="1.5"/>
 <path d="M666 205Q694 193 722 205L720 214Q694 226 668 214Z" fill="#2b465f" opacity=".88"/>
 <path d="M670 192Q694 179 718 192L722 199Q694 211 666 199Z" fill="#cbd5d9" opacity=".72"/>
 <path d="M674 218Q694 230 714 218L709 229Q694 237 679 229Z" fill="#dce1e1" opacity=".82"/>
 <path d="M674 195 681 183 685 231M714 195 707 183 703 231" fill="none" stroke="#f6e7d0" stroke-opacity=".55" stroke-width="1.5"/>
 <!-- observation decks / horizontal rings -->
 <path d="M665 199Q694 184 723 199M667 214Q694 229 721 214M676 230Q694 238 712 230" fill="none" stroke="#f4ead9" stroke-width="2"/>
 <!-- antenna mast -->
 <path d="M691 177 692 104 694 51 696 104 697 177Z" fill="url(#tower)" stroke="#d8e0e2" stroke-width=".8"/>
 <path d="M694 52 694 25" stroke="#e9e6dc" stroke-width="1.5"/>
 <circle cx="694" cy="25" r="2.7" fill="#ffd29b"><animate attributeName="opacity" values=".45;1;.45" dur="3.2s" repeatCount="indefinite"/></circle>
 <circle cx="694" cy="25" r="9" fill="#ffc27f" opacity=".2" filter="url(#glow)"/>
 <!-- shaft lights -->
 <g fill="#f7c58d"><circle cx="692" cy="275" r="1.4"/><circle cx="696" cy="319" r="1.2"/><circle cx="693" cy="367" r="1.2"/><circle cx="698" cy="411" r="1.3"/></g>
</g>
<!-- foreground buildings, irregular rooflines and balconies -->
<g fill="#0b1b2e">
 <path d="M0 474v-64h38v64h15v-87h57v87h18v-55h42v55h15v-97h61v97h17v-72h45v72h17v-105h58v105h18v-76h45v76h16v-91h61v91h18v-65h43v65h18v-106h60v106h17v-72h45v72h18v-91h58v91h17v-60h48v60h18v-86h57v86h16v-67h47v67h20v-100h57v100h20v-73h50v73h10v66H0Z"/>
</g>
<g opacity=".88" fill="url(#dim)">
 <path d="M0 474v-64h38v64h15v-87h57v87h18v-55h42v55h15v-97h61v97h17v-72h45v72h17v-105h58v105h18v-76h45v76h16v-91h61v91h18v-65h43v65h18v-106h60v106h17v-72h45v72h18v-91h58v91h17v-60h48v60h18v-86h57v86h16v-67h47v67h20v-100h57v100h20v-73h50v73h10v66H0Z"/>
</g>
