<path d="M-30 528Q190 477 365 508T690 509Q824 507 990 435" fill="none" stroke="#a7b5bf" stroke-opacity=".35" stroke-width="1.5"/>
<path d="M-20 526Q180 484 363 513T690 514Q824 512 985 443" fill="none" stroke="#f9c18a" stroke-width="2.5" stroke-dasharray="20 42" opacity=".85"><animate attributeName="stroke-dashoffset" from="0" to="-124" dur="4.8s" repeatCount="indefinite"/></path>
<path d="M-20 544Q190 500 364 530T690 531Q824 529 985 460" fill="none" stroke="#d5e6ef" stroke-width="1.8" stroke-dasharray="12 48" opacity=".65"><animate attributeName="stroke-dashoffset" from="0" to="130" dur="5.6s" repeatCount="indefinite"/></path>
<rect width="960" height="540" fill="none" stroke="#f1d1ad" stroke-opacity=".12" stroke-width="2"/>
</svg>