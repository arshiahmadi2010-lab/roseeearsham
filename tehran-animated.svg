<g fill="#d9e1e4" opacity=".75"><path d="m235 266 29-30 27 29-17-8-10 8-8-5-9 8Z"/><path d="m338 247 27-30 27 34-17-9-9 8-10-7-8 8Z"/><path d="m432 238 26-30 24 30-15-7-8 7-9-5-8 7Z"/><path d="m521 216 20-29 26 38-17-12-8 8-9-7-6 6Z"/><path d="m593 224 18-27 22 33-15-9-8 6-8-6Z"/></g>
<path d="M0 372q150-45 290-20t270-5q180-28 400 20v100H0Z" fill="#26394f" opacity=".9"/>
