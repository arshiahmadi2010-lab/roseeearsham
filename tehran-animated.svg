<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071426"/><stop offset=".52" stop-color="#17304d"/><stop offset=".82" stop-color="#765b62"/><stop offset="1" stop-color="#e2a36f"/></linearGradient>
 <radialGradient id="horizon"><stop stop-color="#f5bc83" stop-opacity=".7"/><stop offset="1" stop-color="#e9a16c" stop-opacity="0"/></radialGradient>
