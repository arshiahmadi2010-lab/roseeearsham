 <linearGradient id="city" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#23384f"/><stop offset="1" stop-color="#081525"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
