<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="نمای شبانه تهران و برج میلاد">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#07172d"/><stop offset=".58" stop-color="#263b59"/><stop offset="1" stop-color="#d18b70"/></linearGradient>
 <linearGradient id="mountain" x2="0" y2="1"><stop stop-color="#8290a1"/><stop offset=".45" stop-color="#465a70"/><stop offset="1" stop-color="#1a2c43"/></linearGradient>
 <linearGradient id="tower" x2="1" y2="0"><stop stop-color="#63798d"/><stop offset=".42" stop-color="#e0e4e4"/><stop offset=".63" stop-color="#f5e8d1"/><stop offset="1" stop-color="#667d92"/></linearGradient>
 <linearGradient id="pod" x2="0" y2="1"><stop stop-color="#f0e7d7"/><stop offset=".24" stop-color="#9bafbc"/><stop offset=".55" stop-color="#405c75"/><stop offset=".8" stop-color="#d7dce0"/><stop offset="1" stop-color="#647d91"/></linearGradient>
 <linearGradient id="building" x2="0" y2="1"><stop stop-color="#40566e"/><stop offset="1" stop-color="#0a1b30"/></linearGradient>
 <radialGradient id="sunset"><stop stop-color="#f4b27d" stop-opacity=".7"/><stop offset="1" stop-color="#f4b27d" stop-opacity="0"/></radialGradient>
 <pattern id="lit" width="17" height="22" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="4" height="7" rx=".6" fill="#ffd39a" opacity=".9"/><rect x="11" y="5" width="3" height="7" rx=".5" fill="#b9d1df" opacity=".45"/></pattern>
 <pattern id="dim" width="19" height="24" patternUnits="userSpaceOnUse"><rect x="4" y="5" width="4" height="8" fill="#e6b887" opacity=".55"/><rect x="12" y="5" width="3" height="8" fill="#9cb5c9" opacity=".28"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="960" height="540" fill="url(#sky)"/>
<ellipse cx="540" cy="355" rx="470" ry="150" fill="url(#sunset)" opacity=".75"/>
<!-- stars -->
<g fill="#e6e9e9" opacity=".6">
 <circle cx="86" cy="68" r="1.3"/><circle cx="178" cy="104" r="1"/><circle cx="305" cy="53" r="1.4"/><circle cx="493" cy="87" r="1"/><circle cx="824" cy="64" r="1.2"/><circle cx="911" cy="126" r="1"/>
</g>
<!-- moving thin clouds -->
<g fill="#c6cbd0" opacity=".16"><path d="M-60 156q50-35 96-5 39-40 83-4 43-2 54 26H-60Z"/><path d="M610 133q42-29 78 1 38-34 75-2 36-1 49 23H610Z"/><animateTransform attributeName="transform" type="translate" values="-25 0;28 -2;-25 0" dur="52s" repeatCount="indefinite"/></g>
<!-- Alborz mountains, with the recognizable high snow ridge -->
<path d="M0 344 62 306 112 318 174 257 216 286 264 236 309 278 365 217 410 266 458 208 498 251 541 187 574 224 611 197 656 260 702 221 753 275 801 239 847 282 907 245 960 282V420H0Z" fill="#52657a" opacity=".62"/>
